[package]
name = "claude-view"
version = "1.5.1"
description = "Live per-session terminal mirror for Claude Code"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
# Native notifications posted under the app's own identity — clicking one
# focuses claude-view (osascript notifications belong to Script Editor).
tauri-plugin-notification = "2"
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
portable-pty = "0.8"
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
# `preserve_order` keeps serde_json::Map backed by an IndexMap instead of a
# BTreeMap. Without it, rewriting ~/.claude/settings.json to add our hooks
# alphabetizes and reflows the user's ENTIRE file — permissions, env, statusLine,
# MCP config — which is not ours to reorder.
serde_json = { version = "1", features = ["preserve_order"] }
dirs = "5"
parking_lot = "0.12"
urlencoding = "2"
futures-util = "0.3"
# Safe cross-platform default-app opener (uses ShellExecuteW on Windows — no
# shell-string parsing, avoids cmd injection).
open = "5"
# Move deleted session transcripts to the OS Trash instead of unlinking them,
# so an accidental delete in the launcher is recoverable from the Trash.
trash = "5"

# Liveness check for instance discovery files: `kill(pid, 0)`, to tell a stale
# file left by a crashed run from one a running instance still owns. Already in
# the lock file transitively (portable-pty, tokio, …), so a direct dependency
# costs nothing — and it beats pulling in something like `sysinfo` to answer a
# single one-syscall question.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
strip = true
lto = true
